[package]
name = "hello-nsh"
version = "0.1.0"
description = "Hello NSH —— 纯 Rust + 平台原生视图的跨平台应用示例"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
chrono = "0.4.45"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
